[package]
name = "scanner-ui"
version = "1.0.1"
edition = "2024"
license = "AGPL-3.0-only"
default-run = "scanner-ui"


[features]
# Also run on X11 desktops. Linking it needs libxkbcommon-x11's development
# package (see build.rs); without this feature the UI is Wayland-only on Linux.
x11 = ["gpui/x11"]
# Do the FFTs with FFTW when it is installed (see radiocore's Cargo.toml).
fftw = ["scanner/fftw"]

# Puts the icon into the Windows program (see build.rs).
[build-dependencies]
winresource = "0.1"

[dependencies]
scanner = { path = "../scanner" , version = "1.0.1" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { version = "0.2.2", default-features = false, features = ["wayland", "font-kit"] }

[target.'cfg(target_os = "windows")'.dependencies]
gpui = "0.2.2"

# Shaders are compiled when the app starts rather than when it is built, which
# would need Xcode's separately-downloaded Metal toolchain.
[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
