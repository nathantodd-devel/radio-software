[package]
name = "scanner-web"
version = "0.3.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "The scanner as a web server: scan here, listen and control from a browser"

[dependencies]
scanner = { path = "../scanner", version = "0.3.0" }
scanner-proto = { path = "../scanner-proto", version = "0.3.0" }
ctrlc = "3"
# For the access code's cookie. The version rustls uses.
ring = "0.17"
# For serving over HTTPS. With the same cryptography library the rest of the
# workspace already builds.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
tungstenite = "0.30"
