[package]
name = "airspy"
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Safe interface to Airspy R2/Mini receivers through libairspy"

[dependencies]
receiver = { path = "../receiver", version = "0.2.0" }

# On desktops the system's libairspy is loaded at run time.
[target.'cfg(not(target_os = "android"))'.dependencies]
libloading = "0.8"

# Android has no system libairspy: it is compiled in from vendor/libairspy
# (see build.rs), along with libusb.
[target.'cfg(target_os = "android")'.dependencies]
libusb1-sys = { version = "0.7", features = ["vendored"] }

[build-dependencies]
cc = "1"
