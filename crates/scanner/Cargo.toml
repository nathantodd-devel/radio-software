[package]
name = "scanner"
version = "1.0.1"
edition = "2024"
license = "AGPL-3.0-only"

[dependencies]
airspy = { path = "../drivers/airspy" , version = "1.0.1" }
rtlsdr = { path = "../drivers/rtlsdr", version = "1.0.1" }
receiver = { path = "../drivers/receiver", version = "1.0.1" }
audio = { path = "../drivers/audio" , version = "1.0.1" }
radiocore = { path = "../radiocore" , version = "1.0.1" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ctrlc = "3"
rusqlite = { version = "0.40.2", features = ["bundled"] }
ureq = "2"
roxmltree = "0.21.1"
# For the updater: reading GitHub's reply and checking what was downloaded.
serde_json = "1"
sha2 = "0.10"
pgp = { version = "0.21.0", default-features = false }
