name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # gpui's Wayland backend, fonts and keyboard handling link against
      # these. No Airspy library is needed: the driver loads it at run time.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype-dev libxcb1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets --locked

      # None of the tests need a radio attached.
      - name: Test
        run: cargo test --workspace --locked
