name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The bundler for the browser client. Pinned by checksum.
  TRUNK_URL: https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz
  TRUNK_SHA256: f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b

jobs:
  check:
    name: Format, lint, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # gpui's Wayland backend, fonts and keyboard handling link against
      # these. No Airspy library is needed: the driver loads it at run time.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig1-dev libfreetype-dev libxcb1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets --locked

      # None of the tests need a radio attached.
      - name: Test
        run: cargo test --workspace --locked

  # The browser client is a project of its own (web/): GPUI compiled to
  # WebAssembly, which needs a nightly toolchain.
  web:
    name: Browser client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The nightly toolchain named in web/rust-toolchain.toml.
      - name: Install the toolchain
        working-directory: web
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install trunk
        run: |
          curl -fsSL -o trunk.tar.gz "$TRUNK_URL"
          echo "$TRUNK_SHA256  trunk.tar.gz" | sha256sum -c -
          tar -xzf trunk.tar.gz -C "$HOME/.cargo/bin" trunk

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web

      - name: Format
        working-directory: web
        run: cargo fmt --check

      - name: Build
        working-directory: web
        run: trunk build --locked
